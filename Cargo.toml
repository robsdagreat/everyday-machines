[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "Everyday Machines production pipeline: spec -> voice -> Blender render -> ffmpeg assembly -> YouTube draft"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
