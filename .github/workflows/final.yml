# Final render + private YouTube draft. Started by hand from the Actions tab (or the GitHub mobile app).
#
# Runs on your own free machine registered as a self-hosted runner (label "render"):
# self-hosted runners use no GitHub minutes and have no 6-hour job limit, which a
# 1080p Cycles render on CPU needs. See deploy/setup-runner.sh.
#
# Upload only happens when video.toml says status = "ready" AND you tick "upload". The upload is
# always PRIVATE: watch it in YouTube Studio and publish from there. That click stays human.

name: final

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Video id (folder name in videos/)"
        required: true
      profile:
        description: "final (1080p) or draft (720p, ~4x faster)"
        default: final
      upload:
        description: "Upload as a PRIVATE draft to YouTube (needs status = ready)"
        type: boolean
        default: false

concurrency:
  group: final-${{ inputs.video }}

permissions:
  contents: write   # needed to publish the release

jobs:
  final:
    runs-on: [self-hosted, render]
    timeout-minutes: 4320
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false   # keep build/ between runs so unchanged shots stay cached

      - name: Build forge
        run: cargo build --release --locked

      - name: Plan
        run: ./target/release/forge plan "${{ inputs.video }}" -p "${{ inputs.profile }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Render and assemble
        run: ./target/release/forge build "${{ inputs.video }}" -p "${{ inputs.profile }}"

      - name: Publish release (permanent download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="build/${{ inputs.video }}/${{ inputs.profile }}"
          tag="${{ inputs.video }}-${{ inputs.profile }}-${{ github.run_number }}"
          gh release create "$tag" \
            "$out/${{ inputs.video }}.mp4" "$out/${{ inputs.video }}.srt" \
            "$out/thumbnail.jpg" "$out/metadata.json" \
            --title "${{ inputs.video }} (${{ inputs.profile }})" \
            --notes "Render of ${{ inputs.video }} at profile ${{ inputs.profile }}, commit ${{ github.sha }}. Download the .mp4 and upload it to YouTube." \
            --prerelease
          echo "Download: $(gh release view "$tag" --json url -q .url)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload to YouTube (private draft)
        if: inputs.upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: ./target/release/forge upload "${{ inputs.video }}" -p "${{ inputs.profile }}" | tee -a "$GITHUB_STEP_SUMMARY"
